[package]
name = "neo-scope-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Read-only HTTP API over the indexed Neo X (EVM) data"

[[bin]]
name = "neo-scope-api"
path = "src/main.rs"

[dependencies]
neo-scope-db = { path = "../lib" }
actix-web = "4"
actix-cors = "0.7"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "time"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "mysql", "chrono", "derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
once_cell = "1.19"
chrono = { version = "0.4", features = ["clock"] }
